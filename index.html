<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diwali Wish Reel</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Outfit:wght@400;600;800&family=Noto+Sans+Tamil:wght@700&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Outfit',sans-serif;background:#070012;color:#fff6ee;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(135deg,#fff0a8,#f0b840 45%,#b8741a);color:#3a1500;font-weight:800;padding:.85rem 1.5rem;border-radius:50px;font-size:1rem;box-shadow:0 4px 22px #ffb70055}
.btn.alt{background:#ffffff1c;color:#fff6ee;border:1px solid #ffffff44;box-shadow:none}
/* creator */
#maker{min-height:100%;display:flex;align-items:center;justify-content:center;padding:max(1.2rem,env(safe-area-inset-top)) 1.2rem 1.2rem;background:radial-gradient(ellipse at 50% 0,#5a0f55,#070012 72%)}
.box{width:100%;max-width:470px;display:flex;flex-direction:column;gap:1rem}
.hd{text-align:center}
.hd .em{font-size:3.4rem;filter:drop-shadow(0 0 20px #ffb703)}
h1{font-family:'Yatra One',serif;font-weight:400;font-size:clamp(1.7rem,6vw,2.3rem);color:#ffd166;text-shadow:0 0 26px #ff9a1a88}
.sub{color:#f3c4e2;font-size:.95rem;margin-top:.3rem;line-height:1.5}
.panel{background:#24072fcc;border:1px solid #ffffff26;border-radius:22px;padding:1.3rem;display:flex;flex-direction:column;gap:1rem}
label{font-size:.8rem;color:#f3c4e2;font-weight:600;display:block;margin-bottom:.3rem}
input,select,textarea{width:100%;background:#3a1050;border:1px solid #ffffff2a;border-radius:12px;padding:.8rem 1rem;color:#fff6ee;font:inherit;font-size:1rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:#ffd166}
textarea{min-height:84px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:420px){.two{grid-template-columns:1fr}}
#out{display:none;background:#12041a;border:1px solid #ffd166;border-radius:14px;padding:1rem}
#out code{display:block;font-size:.72rem;color:#ffd166;word-break:break-all;max-height:54px;overflow:hidden;margin-bottom:.8rem}
.acts{display:flex;gap:.5rem;flex-wrap:wrap}
.note{font-size:.75rem;color:#b9a0cc;text-align:center}
/* show */
#show{position:fixed;inset:0;display:none;background:linear-gradient(#050018,#1d0b40 48%,#7a1d55 80%,#ff8a3d);overflow:hidden;touch-action:manipulation}
#show.on{display:block}
#bg,#c{position:absolute;inset:0;width:100%;height:100%}
#cap{position:absolute;left:0;right:0;bottom:calc(20% + env(safe-area-inset-bottom));text-align:center;padding:0 1.2rem;pointer-events:none;z-index:3}
#cap .l{display:inline-block;max-width:720px;font-family:'Yatra One','Noto Sans Tamil','Noto Sans Devanagari',serif;font-size:clamp(1.25rem,4.4vw,2.4rem);line-height:1.35;color:#ffe9a0;text-shadow:0 0 14px #ff9a1a,0 0 38px #ff5d00;opacity:0;transform:translateY(16px) scale(.96);transition:opacity 1s,transform 1s}
#cap .l.on{opacity:1;transform:none}
#start{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;text-align:center;padding:1.5rem;background:radial-gradient(circle,#3b0b45cc,#04000cf2)}
#start .em{font-size:4.5rem;animation:fk 1.2s ease-in-out infinite alternate;filter:drop-shadow(0 0 24px #ffb703)}
#start h2{font-family:'Yatra One','Noto Sans Tamil',serif;font-weight:400;font-size:clamp(1.5rem,5vw,2.4rem);color:#ffd166}
#start p{color:#f3c4e2}
@keyframes fk{to{transform:scale(1.12) rotate(3deg)}}
#end{position:absolute;left:0;right:0;bottom:calc(5% + env(safe-area-inset-bottom));display:none;justify-content:center;gap:.6rem;flex-wrap:wrap;z-index:4;padding:0 1rem}
#end.on{display:flex}
.top{position:absolute;top:max(.8rem,env(safe-area-inset-top));z-index:6}
</style></head><body>

<div id="maker"><div class="box">
  <div class="hd"><div class="em">🪔</div><h1>Send a Diwali Wish</h1>
  <div class="sub">Your friend opens the link and watches rockets, crackers and diyas write your wish across the night sky.</div></div>
  <div class="panel">
    <div class="two">
      <div><label>Who is it for? *</label><input id="to" maxlength="30" placeholder="Friend's name" autocomplete="off"></div>
      <div><label>Who is sending? *</label><input id="fr" maxlength="30" placeholder="Your name" autocomplete="off"></div>
    </div>
    <div><label>Big sky text language</label><select id="lg"><option value="en">English: HAPPY DIWALI</option><option value="ta">தமிழ்: இனிய தீபாவளி</option><option value="hi">हिन्दी: शुभ दीपावली</option></select></div>
    <div><label>Your wish</label><textarea id="ms" maxlength="200"></textarea></div>
    <button class="btn" onclick="gen()">🔗 Create Link</button>
    <div id="out"><code id="url"></code>
      <div class="acts"><button class="btn" onclick="cp()">📋 Copy</button><button class="btn alt" onclick="wa()">💬 WhatsApp</button><button class="btn alt" onclick="sh()">↗ Share</button><button class="btn alt" onclick="prev()">▶ Preview</button></div></div>
  </div>
  <div class="note">Works on phone and computer. Turn the sound on for the full show 🔊</div>
</div></div>

<div id="show">
  <canvas id="bg"></canvas><canvas id="c"></canvas>
  <button class="btn alt top" id="back" style="left:.8rem;display:none" onclick="stop()">← Back</button>
  <button class="btn alt top" id="mute" style="right:.8rem;padding:.5rem .9rem" onclick="togMute()">🔊</button>
  <div id="cap"></div>
  <div id="end"><button class="btn alt" onclick="play(cur)">🔁 Watch again</button><button class="btn" id="own" onclick="location.href=location.pathname">🪔 Send your own</button></div>
  <div id="start"><div class="em">🪔</div><h2 id="sh2"></h2><p id="sp"></p><button class="btn" id="go" style="font-size:1.15rem;padding:1rem 2.2rem" onclick="begin()">▶ Tap to open</button></div>
</div>

<script>
const $=i=>document.getElementById(i),pick=a=>a[Math.random()*a.length|0],rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LANG={
en:{t:['HAPPY','DIWALI'],m:'May the festival of lights fill your life with joy, health and endless happiness.',g:n=>`Hey ${n} 👋`,s:'A Diwali surprise is waiting',w:'With love'},
ta:{t:['இனிய','தீபாவளி'],m:'தீபத் திருநாள் உங்கள் வாழ்வில் மகிழ்ச்சியும் ஒளியும் நிறைக்கட்டும்.',g:n=>`${n}, உங்களுக்காக 🪔`,s:'ஒரு தீபாவளி ஆச்சரியம் காத்திருக்கிறது',w:'அன்புடன்'},
hi:{t:['शुभ','दीपावली'],m:'दीपों का यह त्योहार आपके जीवन में खुशियाँ और रोशनी भर दे।',g:n=>`${n}, आपके लिए 🪔`,s:'एक दिवाली सरप्राइज़ आपका इंतज़ार कर रहा है',w:'प्यार के साथ'}};
let cur=null,isPrev=false;

/* ---------- creator ---------- */
$('ms').value=LANG.en.m;
$('lg').onchange=()=>{const m=$('ms');if(!m.value.trim()||Object.values(LANG).some(l=>l.m===m.value))m.value=LANG[$('lg').value].m};
const data=()=>({n:$('to').value.trim(),f:$('fr').value.trim(),m:$('ms').value.trim(),l:$('lg').value});
function ok(){const d=data();if(!d.n){alert("Please enter your friend's name");$('to').focus();return 0}if(!d.f){alert('Please enter your name');$('fr').focus();return 0}return 1}
function link(){const j=btoa(unescape(encodeURIComponent(JSON.stringify(data())))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return location.href.split('?')[0].split('#')[0]+'?c='+j}
function gen(){if(!ok())return;$('url').textContent=link();$('out').style.display='block'}
function cp(){const u=link();navigator.clipboard?navigator.clipboard.writeText(u).then(()=>alert('Link copied!')):prompt('Copy:',u)}
const txt=()=>`🪔 ${data().n}, ${data().f} sent you a Diwali surprise! Open it with sound on 🔊💥\n`;
function wa(){if(ok())window.open('https://wa.me/?text='+encodeURIComponent(txt()+link()),'_blank')}
function sh(){if(!ok())return;navigator.share?navigator.share({title:'Diwali wish',text:txt(),url:link()}).catch(()=>{}):cp()}
function prev(){if(!ok())return;isPrev=true;open_(data())}

/* ---------- engine ---------- */
const cv=$('c'),x=cv.getContext('2d'),bg=$('bg'),bx=bg.getContext('2d');
let W,H,dp,P=[],R=[],TP=[],E=[],D=[],tm=[],alive=0,raf=0,mute=false,AC=null,t0=0;
function size(){dp=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;[cv,bg].forEach(c=>{c.width=W*dp;c.height=H*dp});x.setTransform(dp,0,0,dp,0,0);bx.setTransform(dp,0,0,dp,0,0);sky()}
function sky(){bx.clearRect(0,0,W,H);
const hz=bx.createLinearGradient(0,H*.55,0,H);hz.addColorStop(0,'rgba(255,120,60,0)');hz.addColorStop(1,'rgba(255,150,60,.5)');bx.fillStyle=hz;bx.fillRect(0,H*.55,W,H*.45);
for(let i=0;i<150;i++){bx.globalAlpha=rnd(.25,1);bx.fillStyle=pick(['#fff','#fff','#ffe9c8','#cfe0ff']);bx.beginPath();bx.arc(Math.random()*W,Math.random()*H*.62,rnd(.4,1.5),0,6.3);bx.fill()}
bx.globalAlpha=1;
for(let i=0;i<5;i++){const cx=rnd(0,W),cy=rnd(H*.12,H*.5),g=bx.createRadialGradient(cx,cy,0,cx,cy,W*.35);g.addColorStop(0,'rgba(150,80,190,.22)');g.addColorStop(1,'rgba(150,80,190,0)');bx.fillStyle=g;bx.fillRect(0,0,W,H)}
let px=-10;while(px<W){const w=rnd(30,80),h=rnd(H*.08,H*.2);bx.fillStyle='#34124f';bx.fillRect(px,H-h,w+1,h);px+=w}
px=0;while(px<W){const w=rnd(28,70),h=rnd(H*.05,H*.15);bx.fillStyle='#0c0418';bx.fillRect(px,H-h,w+1,h);
if(Math.random()<.5){bx.fillRect(px+w*.35,H-h-14,w*.3,14);bx.beginPath();bx.arc(px+w/2,H-h-14,w*.15,Math.PI,0);bx.fill()}
for(let k=0;k<h/14;k++)if(Math.random()<.5){bx.fillStyle=pick(['#ffcf6aee','#ff9a1acc','#fff0a8dd']);bx.fillRect(px+rnd(4,w-8),H-h+8+k*14,4,5)}px+=w}}
addEventListener('resize',()=>{if(alive)size()});
const PAL=['#ffd166','#ff5d8f','#7df9ff','#fff3b0','#c77dff','#ff9a1a','#6dff9a'];let F=[];
function spark(px,py,vx,vy,c,l,s,o){P.push(Object.assign({x:px,y:py,vx,vy,c,l:l||1,d:rnd(.008,.02),s:s||rnd(1.6,3.2),g:.07,dr:.985},o))}
function burst(px,py,n,col,sp){sp=sp||7;const ty=Math.random(),c1=col||pick(PAL),c2=pick(PAL);F.push({x:px,y:py,l:1,c:col||c1});
if(ty<.25&&!col){for(let i=0;i<n*1.1;i++){const a=rnd(0,6.283),v=sp*rnd(.25,.85);spark(px,py,Math.cos(a)*v,Math.sin(a)*v,'#ffcf5a',1.7,rnd(1.5,2.5),{d:.006,g:.034,dr:.99,cr:1})}}
else{const ring=ty<.55;for(let i=0;i<n;i++){const a=6.283*i/n+rnd(0,.15),v=ring?sp:sp*rnd(.3,1);spark(px,py,Math.cos(a)*v,Math.sin(a)*v,i%3?c1:c2,1.1,0,{cr:Math.random()<.25})}}
for(let i=0;i<14;i++){const a=rnd(0,6.283),v=rnd(1,sp*.6);spark(px,py,Math.cos(a)*v,Math.sin(a)*v,'#fff',.35,rnd(3,5),{d:.04})}}
function rocket(tx,ty,cb,c){const sx=tx+rnd(-60,60);R.push({x:sx,y:H,tx,ty,c:c||'#ffd166',cb});whistle()}
function pts(t,sz){const o=document.createElement('canvas'),c=o.getContext('2d'),f=`700 ${sz}px 'Yatra One','Noto Sans Tamil','Noto Sans Devanagari',sans-serif`;c.font=f;const w=Math.ceil(c.measureText(t).width)+24,h=Math.ceil(sz*1.5);o.width=w;o.height=h;c.font=f;c.fillStyle='#fff';c.textBaseline='middle';c.fillText(t,12,h/2);const g=c.getImageData(0,0,w,h).data,out=[],st=Math.round(sz/30)+1;for(let j=0;j<h;j+=st)for(let i=0;i<w;i+=st)if(g[(j*w+i)*4+3]>128)out.push([i-w/2,j-h/2]);return out}
function word(t,fy,sz){const cx=W/2,cy=H*fy;rocket(cx,cy,()=>{boom();burst(cx,cy,60,'#fff3b0',9);pts(t,sz).forEach(p=>{const a=rnd(0,6.283),v=rnd(2,16);TP.push({sx:cx+Math.cos(a)*v*9,sy:cy+Math.sin(a)*v*9,tx:cx+p[0],ty:cy+p[1],k:0,l:1,c:pick(['#fff3b0','#ffd166','#ffb703','#ffe9a0']),h:rnd(.0006,.0016)})})})}
function crack(type,px,ms){const e={type,x:px,a:0,until:performance.now()+ms};E.push(e)}
function dy(i,n,tt){if(!D[i])return;const k=Math.min(1,(tt-D[i])/800);if(k<=0)return;const px=W*(i+.5)/n,s=Math.min(W/(n*2),34),py=H-Math.max(26,H*.045),f=1+Math.sin(tt/95+i*2.3)*.1+Math.sin(tt/37+i)*.05;
const gr=x.createRadialGradient(px,py,0,px,py,s*6);gr.addColorStop(0,`rgba(255,170,60,${.42*k})`);gr.addColorStop(1,'rgba(255,120,0,0)');x.fillStyle=gr;x.fillRect(px-s*6,py-s*3,s*12,s*6);
const gl=x.createRadialGradient(px,py-s*1.6,0,px,py-s*1.6,s*4*f);gl.addColorStop(0,`rgba(255,210,100,${.6*k})`);gl.addColorStop(1,'rgba(255,120,0,0)');x.fillStyle=gl;x.fillRect(px-s*5,py-s*6,s*10,s*8);
const bw=x.createLinearGradient(px-s,py,px+s,py+s*.6);bw.addColorStop(0,'#e08a3a');bw.addColorStop(.5,'#a8501c');bw.addColorStop(1,'#5a2208');x.globalAlpha=1;x.fillStyle=bw;x.beginPath();x.ellipse(px,py,s,s*.62,0,0,Math.PI);x.fill();
x.fillStyle='#ffcf6a';x.beginPath();x.ellipse(px,py,s,s*.2,0,0,6.3);x.fill();x.fillStyle='#4a1a04';x.beginPath();x.ellipse(px,py,s*.8,s*.13,0,0,6.3);x.fill();
x.globalAlpha=k;const fh=s*2.7*f,fg=x.createLinearGradient(0,py-fh,0,py);fg.addColorStop(0,'rgba(255,90,0,0)');fg.addColorStop(.35,'#ff9a1a');fg.addColorStop(.75,'#ffe27a');fg.addColorStop(1,'#fff');x.fillStyle=fg;x.beginPath();x.moveTo(px,py-fh);x.quadraticCurveTo(px+s*.75,py-s*1.1,px,py-s*.25);x.quadraticCurveTo(px-s*.75,py-s*1.1,px,py-fh);x.fill();
x.fillStyle='#8fd0ff';x.globalAlpha=.55*k;x.beginPath();x.ellipse(px,py-s*.5,s*.18,s*.4,0,0,6.3);x.fill();x.globalAlpha=1}
function loop(now){if(!alive)return;raf=requestAnimationFrame(loop);
x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.13)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
const tt=now-t0;
F=F.filter(f=>f.l>0);F.forEach(f=>{const g=x.createRadialGradient(f.x,f.y,0,f.x,f.y,Math.max(W,H)*.6);g.addColorStop(0,f.c+'');g.addColorStop(1,'#0000');x.globalAlpha=.26*f.l*f.l;x.fillStyle=g;x.fillRect(0,0,W,H);f.l-=.045});x.globalAlpha=1;
E=E.filter(e=>{if(now>e.until)return false;if(e.type==='anar'){F.push({x:e.x,y:H*.78,l:.35,c:'#ff9a1a'});for(let i=0;i<10;i++)spark(e.x,H*.8,rnd(-2,2),rnd(-14,-7),pick(['#ffd166','#ff9a1a','#fff3b0','#ffffff']),.85,rnd(1.4,2.8),{cr:Math.random()<.3})}
else{e.a+=.38;for(let i=0;i<4;i++){const a=e.a+i*1.57,r=22;spark(e.x+Math.cos(a)*r,H*.58+Math.sin(a)*r,-Math.sin(a)*6+rnd(-1,1),Math.cos(a)*6+rnd(-1,1),pick(['#ffb703','#ff5d8f','#fff3b0','#7df9ff']),.7,rnd(1.4,2.4))}}return true});
R=R.filter(r=>{const dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy),sp=Math.max(9,H/55);if(d<sp){r.cb&&r.cb();return false}r.x+=dx/d*sp;r.y+=dy/d*sp;spark(r.x,r.y,rnd(-.5,.5),rnd(.5,1.5),'#ffb703',.5,rnd(1,2));x.globalAlpha=1;x.fillStyle='#fff';x.shadowBlur=14;x.shadowColor=r.c;x.fillRect(r.x-1.5,r.y-5,3,10);x.shadowBlur=0;return true});
P=P.filter(p=>{if(p.l<=0){if(p.cr)for(let k=0;k<3;k++)spark(p.x,p.y,rnd(-2,2),rnd(-2,2),'#fff',.3,1.6,{d:.08,g:.02});return false}return true});P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=p.dr;p.vy=p.vy*p.dr+p.g;p.l-=p.d;const a=Math.min(1,Math.max(p.l,0)),rr=p.s*Math.max(a,.45);x.globalAlpha=a*.22;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,rr*4,0,6.3);x.fill();x.globalAlpha=a;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,rr,0,6.3);x.fill();if(p.l>.8){x.fillStyle='#fff';x.globalAlpha=a;x.beginPath();x.arc(p.x,p.y,rr*.6,0,6.3);x.fill()}});
TP=TP.filter(p=>p.l>0);TP.forEach(p=>{if(p.k<1){p.k=Math.min(1,p.k+.022)}else p.l-=p.h*16;const e=1-Math.pow(1-p.k,3),px=p.sx+(p.tx-p.sx)*e,py=p.sy+(p.ty-p.sy)*e,tw=.75+Math.sin(now/90+p.tx)*.25,a=Math.max(p.l,0)*Math.min(1,p.k*2)*tw;x.fillStyle=p.c;x.globalAlpha=a*.28;x.beginPath();x.arc(px,py,8,0,6.3);x.fill();x.globalAlpha=a;x.beginPath();x.arc(px,py,2.6,0,6.3);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(px,py,1.2,0,6.3);x.fill()});
x.globalAlpha=1;for(let i=0;i<D.length;i++)dy(i,D.length,now);x.globalAlpha=1}
/* ---------- sound ---------- */
function ac(){try{AC=AC||new(window.AudioContext||webkitAudioContext)()}catch(e){}return AC}
function whistle(){if(mute||!ac())return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(500,AC.currentTime);o.frequency.exponentialRampToValueAtTime(2000,AC.currentTime+.9);g.gain.setValueAtTime(.03,AC.currentTime);g.gain.linearRampToValueAtTime(0,AC.currentTime+.9);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.9)}
function boom(){if(mute||!ac())return;const n=AC.createBuffer(1,AC.sampleRate*.7,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=n;f.type='lowpass';f.frequency.value=420;g.gain.value=.8;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
function togMute(){mute=!mute;$('mute').textContent=mute?'🔇':'🔊'}
/* ---------- the show ---------- */
const at=(ms,f)=>tm.push(setTimeout(f,ms));
function cap(h){const c=$('cap');c.innerHTML=`<div class="l">${h}</div>`;requestAnimationFrame(()=>requestAnimationFrame(()=>c.firstChild&&c.firstChild.classList.add('on')))}
function capOff(){const l=$('cap').firstChild;l&&l.classList.remove('on')}
function pop(px,py,c){rocket(px,py,()=>{boom();burst(px,py,90,c);burst(px,py,30,'#fff',3)},c)}
function open_(d){cur=d;const L=LANG[d.l]||LANG.en;size();$('show').classList.add('on');$('maker').style.display='none';$('back').style.display=isPrev?'block':'none';
