<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diwali Wish Reel</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Outfit:wght@400;600;800&family=Noto+Sans+Tamil:wght@700&family=Cinzel:wght@600&family=Cormorant+Garamond:wght@700&family=Noto+Serif+Tamil:wght@600&family=Rozha+One&family=Baloo+Thambi+2:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Outfit',sans-serif;background:#070012;color:#fff6ee;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(135deg,#fff0a8,#f0b840 45%,#b8741a);color:#3a1500;font-weight:800;padding:.85rem 1.5rem;border-radius:50px;font-size:1rem;box-shadow:0 4px 22px #ffb70055}
.btn.alt{background:#ffffff1c;color:#fff6ee;border:1px solid #ffffff44;box-shadow:none}
.demo{padding:.5rem .9rem;font-size:.85rem}
#maker{min-height:100%;display:flex;align-items:center;justify-content:center;padding:max(1.2rem,env(safe-area-inset-top)) 1.2rem 1.2rem;background:linear-gradient(#0007,#000b),var(--bgi) center/cover fixed}
.box{width:100%;max-width:470px;display:flex;flex-direction:column;gap:1rem}
.hd{text-align:center}
.hd .em{font-size:3.4rem;filter:drop-shadow(0 0 20px #ffb703)}
h1{font-family:'Yatra One',serif;font-weight:400;font-size:clamp(1.7rem,6vw,2.3rem);color:#ffd166;text-shadow:0 0 26px #ff9a1a88}
.sub{color:#f3c4e2;font-size:.95rem;margin-top:.3rem;line-height:1.5}
.panel{background:#24072fcc;border:1px solid #ffffff26;border-radius:22px;padding:1.3rem;display:flex;flex-direction:column;gap:1rem}
label{font-size:.8rem;color:#f3c4e2;font-weight:600;display:block;margin-bottom:.3rem}
input,select,textarea{width:100%;background:#3a1050;border:1px solid #ffffff2a;border-radius:12px;padding:.8rem 1rem;color:#fff6ee;font:inherit;font-size:1rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:#ffd166}
textarea{min-height:84px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:420px){.two{grid-template-columns:1fr}}
#out{display:none;background:#12041a;border:1px solid #ffd166;border-radius:14px;padding:1rem}
#out code{display:block;font-size:.72rem;color:#ffd166;word-break:break-all;max-height:54px;overflow:hidden;margin-bottom:.8rem}
.acts{display:flex;gap:.5rem;flex-wrap:wrap}
.note{font-size:.75rem;color:#b9a0cc;text-align:center}
#show{position:fixed;inset:0;display:none;background:linear-gradient(#050018,#1d0b40 48%,#7a1d55 80%,#ff8a3d);overflow:hidden;touch-action:manipulation}
#show.on{display:block}
#bg,#c{position:absolute;inset:0;width:100%;height:100%}
#cap{position:absolute;left:0;right:0;bottom:calc(20% + env(safe-area-inset-bottom));text-align:center;padding:0 1.2rem;pointer-events:none;z-index:3}
#cap .l{display:inline-block;max-width:720px;font-family:'Cormorant Garamond','Noto Serif Tamil',serif;font-weight:700;font-size:clamp(1.4rem,4.4vw,2.4rem);line-height:1.35;color:#ffe9a0;text-shadow:0 0 14px #ff9a1a,0 0 38px #ff5d00;opacity:0;transform:translateY(16px) scale(.96);transition:opacity 1s,transform 1s}
#cap .l.on{opacity:1;transform:none}
#start{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;text-align:center;padding:1.5rem;background:radial-gradient(circle,#2a000899,#0a0004e6),var(--bgi) center/cover}
#start h2{font-family:'Yatra One','Noto Sans Tamil',serif;font-weight:400;font-size:clamp(1.5rem,5vw,2.4rem);color:#ffd166}
#start p{color:#f3c4e2}
#rk{font-size:5.5rem;cursor:pointer;filter:drop-shadow(0 0 24px #ffb703);animation:fk 1s ease-in-out infinite alternate;transition:transform .8s cubic-bezier(.4,0,1,1),opacity .8s;user-select:none}
#rk.fly{transform:translateY(-75vh) scale(.5);opacity:0;animation:none}
@keyframes fk{to{transform:scale(1.12) rotate(3deg)}}
#ttl{position:absolute;left:0;right:0;top:30%;text-align:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .8s;font-family:'Yatra One','Noto Sans Tamil','Noto Sans Devanagari',serif;font-size:clamp(2.6rem,13vw,6rem);line-height:1.15;background:linear-gradient(#fff6c0,#ffb703);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ff7a00)}
#ttl.on{opacity:1}
#story{position:absolute;left:0;right:0;top:22%;display:none;z-index:3;pointer-events:none}
#story svg{width:min(92vw,560px);display:block;margin:auto}
#story.go #ck{animation:fly 1.6s .3s ease-in forwards}
#story.go #nk{animation:die .6s 1.9s forwards;transform-box:fill-box;transform-origin:center}
@keyframes fly{from{transform:translate(75px,70px)}to{transform:translate(225px,70px)}}
@keyframes die{to{opacity:0;transform:scale(1.7)}}
#end{position:absolute;left:0;right:0;bottom:calc(5% + env(safe-area-inset-bottom));display:none;justify-content:center;gap:.6rem;flex-wrap:wrap;z-index:4;padding:0 1rem}
#end.on{display:flex}
.top{position:absolute;top:max(.8rem,env(safe-area-inset-top));z-index:6}
#scene{position:absolute;left:50%;bottom:19%;transform:translateX(-50%);width:min(96vw,720px);height:50vh;max-height:540px;z-index:1;opacity:0;transition:opacity 1.5s;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;--d:min(34vw,250px)}
#scene.on{opacity:1}
#kr{height:62%;max-width:58%;object-fit:contain;filter:drop-shadow(0 0 22px #ffb703cc);animation:bob 3s ease-in-out infinite alternate}
#nk{height:100%;max-width:42%;object-fit:contain;filter:drop-shadow(0 0 22px #ff2d55cc);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite alternate}
#ck{position:absolute;left:36%;top:38%;width:clamp(38px,9vw,64px);height:clamp(38px,9vw,64px);opacity:0;filter:drop-shadow(0 0 12px #ffb703)}
#ck svg{width:100%;height:100%;animation:sp .9s linear infinite}
#scene.throw #ck{animation:thr 1.6s .3s ease-in forwards}
#scene.throw #nk{animation:die .7s 1.9s forwards}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(-6px)}}
@keyframes sway{to{transform:rotate(1.5deg) scale(1.015)}}
@keyframes thr{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1)}90%{opacity:1;transform:translateX(var(--d))}100%{opacity:0;transform:translateX(var(--d)) scale(1.6)}}

<div id="maker"><div class="box">
  <div class="hd"><div class="orn">❖</div><h1>Diwali Greetings</h1>
  <div class="sub">Create a personalised Diwali greeting and share it as a link. It opens as a short celebratory animation.</div></div>
  <div class="panel"><label>Sample greetings (no need to create)</label><div class="acts"><button class="btn alt demo" onclick="demo(0)">English</button><button class="btn alt demo" onclick="demo(1)">தமிழ்</button><button class="btn alt demo" onclick="demo(2)">Amma</button><button class="btn alt demo" onclick="demo(3)">Friends</button></div></div>
  <div class="panel">
    <div class="two">
      <div><label>Who is it for? *</label><input id="to" maxlength="30" placeholder="Friend’s name" autocomplete="off"></div>
      <div><label>Who is sending? *</label><input id="fr" maxlength="30" placeholder="Your name" autocomplete="off"></div>
    </div>
    <div><label>Big sky text language</label><select id="lg"><option value="en">English: HAPPY DIWALI</option><option value="ta">தமிழ்: இனிய தீபாவளி</option></select></div>
    <div><label>Sign-off (end of the wish)</label><select id="sg"><option value="wishes">Best wishes</option><option value="love">With love (for close ones)</option><option value="regards">With regards (for elders / office)</option></select></div>
    <div><label>Your wish</label><textarea id="ms" maxlength="200"></textarea></div>
    <button class="btn" onclick="gen()">Create Link</button>
    <div id="out"><code id="url"></code>
      <div class="acts"><button class="btn" onclick="cp()">Copy</button><button class="btn alt" onclick="wa()">WhatsApp</button><button class="btn alt" onclick="sh()">Share</button><button class="btn alt" onclick="prev()">Preview</button></div></div>
  </div>
  <div class="note">Best experienced with sound on.</div>

const cv=$('c'),x=cv.getContext('2d'),bg=$('bg'),bx=bg.getContext('2d');

const hz=bx.createLinearGradient(0,H*.55,0,H);hz.addColorStop(0,'rgba(255,120,60,0)');hz.addColorStop(1,'rgba(255,150,60,.5)');bx.fillStyle=hz;bx.fillRect(0,H*.55,W,H*.45);

bx.globalAlpha=1;
for(let i=0;i<5;i++){const cx=rnd(0,W),cy=rnd(H*.12,H*.5),g=bx.createRadialGradient(cx,cy,0,cx,cy,W*.35);g.addColorStop(0,'rgba(150,80,190,.22)');g.addColorStop(1,'rgba(150,80,190,0)');bx.fillStyle=g;bx.fillRect(0,0,W,H)}

function kolam(cx,cy,r){bx.save();bx.globalAlpha=.5;bx.strokeStyle='#ffe9c8';bx.fillStyle='#fff';bx.lineWidth=1.3;for(let k=0;k<4;k++){bx.beginPath();bx.ellipse(cx,cy,r,r*.36,k*Math.PI/4,0,6.3);bx.stroke()}bx.beginPath();bx.arc(cx,cy,r*1.12,0,6.3);bx.stroke();for(let k=0;k<8;k++){const a=k*Math.PI/4;bx.beginPath();bx.arc(cx+Math.cos(a)*r*1.3,cy+Math.sin(a)*r*1.3,1.8,0,6.3);bx.fill()}bx.restore()}

const PAL=['#ffd166','#ff5d8f','#7df9ff','#fff3b0','#c77dff','#ff9a1a','#6dff9a'];let F=[];

function pts(t,sz){const o=document.createElement('canvas'),c=o.getContext('2d'),f=cur&&cur.l==='ta'?`800 ${sz}px 'Baloo Thambi 2','Noto Sans Tamil',sans-serif`:`400 ${sz}px 'Rozha One','Yatra One',serif`;c.font=f;const w=Math.ceil(c.measureText(t).width)+24,h=Math.ceil(sz*1.5);o.width=w;o.height=h;c.font=f;c.fillStyle='#fff';c.textBaseline='middle';c.fillText(t,12,h/2);const g=c.getImageData(0,0,w,h).data,out=[],st=Math.round(sz/30)+1;for(let j=0;j<h;j+=st)for(let i=0;i<w;i+=st)if(g[(j*w+i)*4+3]>128)out.push([i-w/2,j-h/2]);return out}
function word(t,fy,sz){const cx=W/2,cy=H*fy;rocket(cx,cy,()=>{boom();burst(cx,cy,60,'#fff3b0',9);pts(t,sz).forEach(p=>{const a=rnd(0,6.283),v=rnd(2,16);TP.push({sx:cx+Math.cos(a)*v*9,sy:cy+Math.sin(a)*v*9,tx:cx+p[0],ty:cy+p[1],k:0,l:1,c:pick(['#fff3b0','#ffd166','#ffb703','#ffe9a0']),h:rnd(.0006,.0016)})})})}
function crack(type,px,ms){E.push({type,x:px,a:0,until:performance.now()+ms})}

const gr=x.createRadialGradient(px,py,0,px,py,s*6);gr.addColorStop(0,`rgba(255,170,60,${.42*k})`);gr.addColorStop(1,'rgba(255,120,0,0)');x.fillStyle=gr;x.fillRect(px-s*6,py-s*3,s*12,s*6);

function loop(now){if(!alive)return;raf=requestAnimationFrame(loop);
x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.13)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
F=F.filter(f=>f.l>0);F.forEach(f=>{const g=x.createRadialGradient(f.x,f.y,0,f.x,f.y,Math.max(W,H)*.6);g.addColorStop(0,f.c+'');g.addColorStop(1,'#0000');x.globalAlpha=.26*f.l*f.l;x.fillStyle=g;x.fillRect(0,0,W,H);f.l-=.045});x.globalAlpha=1;
E=E.filter(e=>{if(now>e.until)return false;if(e.type==='anar'){F.push({x:e.x,y:H*.78,l:.35,c:'#ff9a1a'});for(let i=0;i<10;i++)spark(e.x,H*.8,rnd(-2,2),rnd(-14,-7),pick(['#ffd166','#ff9a1a','#fff3b0','#ffffff']),.85,rnd(1.4,2.8),{cr:Math.random()<.3})}
else{e.a+=.38;for(let i=0;i<4;i++){const a=e.a+i*1.57,r=22;spark(e.x+Math.cos(a)*r,H*.58+Math.sin(a)*r,-Math.sin(a)*6+rnd(-1,1),Math.cos(a)*6+rnd(-1,1),pick(['#ffb703','#ff5d8f','#fff3b0','#7df9ff']),.7,rnd(1.4,2.4))}}return true});
R=R.filter(r=>{const dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy),sp=Math.max(9,H/55);if(d<sp){r.cb&&r.cb();return false}r.x+=dx/d*sp;r.y+=dy/d*sp;spark(r.x,r.y,rnd(-.5,.5),rnd(.5,1.5),'#ffb703',.5,rnd(1,2));x.globalAlpha=1;x.fillStyle='#fff';x.shadowBlur=14;x.shadowColor=r.c;x.fillRect(r.x-1.5,r.y-5,3,10);x.shadowBlur=0;return true});
P=P.filter(p=>{if(p.l<=0){if(p.cr)for(let k=0;k<3;k++)spark(p.x,p.y,rnd(-2,2),rnd(-2,2),'#fff',.3,1.6,{d:.08,g:.02});return false}return true});P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=p.dr;p.vy=p.vy*p.dr+p.g;p.l-=p.d;const a=Math.min(1,Math.max(p.l,0)),rr=p.s*Math.max(a,.45);x.globalAlpha=a*.22;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,rr*4,0,6.3);x.fill();x.globalAlpha=a;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,rr,0,6.3);x.fill();if(p.l>.8){x.fillStyle='#fff';x.globalAlpha=a;x.beginPath();x.arc(p.x,p.y,rr*.6,0,6.3);x.fill()}});
TP=TP.filter(p=>p.l>0);TP.forEach(p=>{if(p.k<1){p.k=Math.min(1,p.k+.022)}else p.l-=p.h*16;const e=1-Math.pow(1-p.k,3),px=p.sx+(p.tx-p.sx)*e,py=p.sy+(p.ty-p.sy)*e,tw=.75+Math.sin(now/90+p.tx)*.25,a=Math.max(p.l,0)*Math.min(1,p.k*2)*tw;x.fillStyle=p.c;x.globalAlpha=a*.28;x.beginPath();x.arc(px,py,8,0,6.3);x.fill();x.globalAlpha=a;x.beginPath();x.arc(px,py,2.6,0,6.3);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(px,py,1.2,0,6.3);x.fill()});
x.globalAlpha=1;for(let i=0;i<D.length;i++)dy(i,D.length,now);x.globalAlpha=1}
function ac(){try{AC=AC||new(window.AudioContext||webkitAudioContext)()}catch(e){}return AC}
function whistle(){if(mute||!ac())return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(500,AC.currentTime);o.frequency.exponentialRampToValueAtTime(2000,AC.currentTime+.9);g.gain.setValueAtTime(.03,AC.currentTime);g.gain.linearRampToValueAtTime(0,AC.currentTime+.9);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.9)}

const at=(ms,f)=>tm.push(setTimeout(f,ms));

$('sh2').textContent=`${d.n}, ${L.s}`;$('sp').textContent=`${SG(d,L)}, ${d.f}`;$('rk').classList.remove('fly');$('start').style.display='flex';$('end').classList.remove('on');$('cap').innerHTML=''}

at(13400,()=>{const r=$('nk').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;boom();burst(cx,cy,110,'#ff5d8f',9);burst(cx,cy,60,'#ffd166',6)});
